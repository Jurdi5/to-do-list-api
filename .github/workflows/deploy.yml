name: Continuous Deployment

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_ASSETS: ${{ join(github.event.release.assets.*.name, ',') }}
    steps:
      - name: Validate release tag and artifact
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ ",$RELEASE_ASSETS," != *,to-do-list-api.zip,* ]]; then
            echo "Release does not contain to-do-list-api.zip" >&2
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Find EC2 instance and deploy through Systems Manager
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=to-do-list-api" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" || "$INSTANCE_ID" == *$'\t'* ]]; then
            echo "Expected exactly one running to-do-list-api EC2 instance; found: $INSTANCE_ID" >&2
            exit 1
          fi
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=sudo /usr/local/bin/deploy-release.sh $RELEASE_TAG" \
            --query 'Command.CommandId' --output text)
          for attempt in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            if [[ "$STATUS" == "Success" ]]; then
              break
            fi
            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json
              exit 1
            fi
            sleep 10
          done
          if [[ "$STATUS" != "Success" ]]; then
            echo "Timed out waiting for Systems Manager deployment command" >&2
            exit 1
          fi
          INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          API_URL="http://$INSTANCE_IP"
          for attempt in $(seq 1 30); do
            VERSION_JSON=$(curl --fail --silent "$API_URL/version" || true)
            if echo "$VERSION_JSON" | jq -e --arg version "$RELEASE_TAG" '.version == $version' >/dev/null; then
              echo "Deployment verified: $API_URL/version returned $VERSION_JSON"
              exit 0
            fi
            sleep 5
          done
          echo "Deployment did not report version $RELEASE_TAG at $API_URL/version" >&2
          exit 1