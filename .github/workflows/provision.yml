name: Provision infrastructure

on:
  workflow_dispatch:
    inputs:
      lab_instance_profile_name:
        description: Existing EC2 instance profile associated with LabRole
        required: true
        default: LabInstanceProfile
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-to-do-list-api
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      LAB_INSTANCE_PROFILE_NAME: ${{ inputs.lab_instance_profile_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform backend
        working-directory: terraform
        run: terraform init -input=false

      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Plan infrastructure
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan -var="lab_instance_profile_name=${LAB_INSTANCE_PROFILE_NAME}"

      - name: Apply infrastructure
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show API URL
        working-directory: terraform
        run: terraform output -raw api_url